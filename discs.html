<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="css/nycta.css">
<script>/* Local preview font (tools/build_fonts.py helvetica). Never ship (DEC-028). file:// and localhost load it by default; ?font=albert shows the shipped font, ?font=helvetica forces the preview. */ (function(){var q=location.search,local=location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);if(/[?&]font=helvetica\b/.test(q)||(local&&!/[?&]font=albert\b/.test(q)))document.write('<link rel="stylesheet" href="preview/helvetica.css">');})();</script>
<style>
body{padding:30px;background:#fff}
.v{margin-bottom:60px}
/* verification only: print discs black like the 1970 masters (geometry check, not color) */
.mono .disc{--line:#000 !important;color:#fff !important}
:root{--module:97.75px}
</style></head><body>
